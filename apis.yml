aid: geniemode
name: Geniemode
description: 'Geniemode (Geniemode Global Pvt Ltd) is a Gurugram, India based B2B cross-border
  sourcing and supply-chain technology company founded in 2021 by Amit Sharma and Tanuj Gangwani.
  It runs an asset-light sourcing platform that connects global retail buyers in home textiles,
  furniture, apparel and accessories with a vetted manufacturer network, covering product discovery
  and design collaboration, sampling, quality control, factory and raw-material management,
  logistics, customs and invoicing. Its technology surface is an internal operations and partner
  portal at portal.geniemode.com, built on Spring Boot, whose Springfox-generated Swagger 2.0
  contract is served publicly while every operation itself sits behind authentication. Geniemode
  publishes no developer program, SDKs, pricing or public API documentation.'
