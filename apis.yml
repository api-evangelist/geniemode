apis:
- name: Geniemode Cataloguing API
  description: 'The Spring Boot application programming interface behind portal.geniemode.com, the
    Geniemode operations and partner portal. Its Springfox-generated Swagger 2.0 contract is served
    anonymously at /api/v2/api-docs and describes 1,042 paths and 1,140 operations across order
    management, quality control, manufacturer and factory management, raw materials, cartons and
    packaging, shipments and couriers, invoicing and finance, commissions, dashboards and Excel
    export. Every operation itself returns HTTP 401 without a session, so the contract is readable
    but the API is not callable by the public.'
