paths:
  /api/v1/path/geniemode-entity:
    get:
      tags:
      - geniemode-entity-controller
      summary: getGeniemodeEntities
      operationId: getGeniemodeEntitiesUsingGET
      parameters:
      - name: ids
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: tags
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
        '403':
          description: Forbidden!!!!!
        '500':
          description: 500 message
    post:
      tags:
      - geniemode-entity-controller
      summary: create
      operationId: createUsingPOST_7
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeniemodeEntityDto'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeniemodeEntityCreatePayload'
