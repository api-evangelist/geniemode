          type: string
        pincode:
          type: string
        search:
          type: string
        state:
          type: string
        type:
          type: string
      title: AddressSubmitRequestPayload
    GeniemodeEntityCreatePayload:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/AddressSubmitRequestPayload'
