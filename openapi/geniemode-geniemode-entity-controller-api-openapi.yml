      summary: addTags
      operationId: addTagsUsingPUT
      parameters:
      - name: geniemodeEntityId
        in: path
        description: geniemodeEntityId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeniemodeEntityDto'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeniemodeEntityCreatePayload'
        description: payload
        required: true
