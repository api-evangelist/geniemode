            type: string
        pod_date:
          type: integer
          format: int64
        pod_number:
          type: string
        projection_date:
          type: integer
          format: int64
        remark:
          type: string
        shipment_docs:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentDocDto'
        shipping_bill_doc:
          type: string
        status:
          type: string
          enum:
          - booked
          - complete
          - deliveryDate
          - paymentFollowup
          - preplanned
          - shipped
        tracking_id:
          type: string
        vessel:
          type: string
      title: ShipmentHopRequestPayload
    CheckForInvoiceRequestPayload:
      type: object
      properties:
        shipment_ids:
          type: array
          items:
            type: integer
            format: int64
      title: CheckForInvoiceRequestPayload
    LeadGenerationLiteResponse:
      type: object
      properties:
        brand:
          $ref: '#/components/schemas/BrandResponse'
        client_id:
          type: integer
          format: int64
        company:
          $ref: '#/components/schemas/CompanyDTO'
        country:
          type: string
        country_code:
          type: string
        created_at:
          type: string
          format: date-time
        creator_id:
          type: integer
          format: int64
        email:
          type: string
        first_name:
          type: string
        id:
          type: integer
          format: int64
        last_name:
          type: string
        lead_projection_list:
          type: array
          items:
            $ref: '#/components/schemas/LeadProjectionMiniDTO'
        name:
          type: string
        phone:
          type: string
      title: LeadGenerationLiteResponse
    ShipmentsRequestPayload:
      type: object
      properties:
        shipments:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentRequestPayload'
      title: ShipmentsRequestPayload
    BrandVpDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        vp_email:
          type: string
        vp_id:
          type: integer
          format: int64
        vp_name:
          type: string
