          type: string
        currency_price:
          type: number
        delivery_charges:
          type: number
        dollar_price:
          type: number
        factory_dollar_price:
          type: number
        freight_cost:
          type: number
        logistic_cost:
          type: number
        logistic_cost_per_piece:
          type: number
        logistic_cost_type:
          type: string
        order_id:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int64
      title: OrderRmLogisticsCostResponsePayload
    VariantBuyerPoMappingRequestPayload:
