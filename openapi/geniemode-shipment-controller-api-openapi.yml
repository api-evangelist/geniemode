    ShipmentHopRequestPayload:
      type: object
      properties:
        actual_date:
          type: integer
          format: int64
        actual_shipment_mode:
          type: string
          enum:
          - Air
          - Courier
          - Land
          - Sea
        bl_date:
          type: integer
          format: int64
        bl_doc:
          type: string
        bl_number:
          type: string
        booking_no:
          type: string
        by_pass_checks:
          type: boolean
        courier_partner_name:
          type: string
        eta:
          type: integer
          format: int64
        etd:
          type: integer
          format: int64
        factory_invoice_docs:
          type: array
          items:
            type: string
        factory_invoice_no:
          type: string
        id:
          type: integer
          format: int64
        invoice_doc_url:
          type: string
        other_shipment_hops:
          type: array
          items:
            type: integer
            format: int64
        packing_list_docs:
          type: array
