        conversion_date_floor:
          type: integer
          format: int64
        costing_details:
          type: array
          items:
            $ref: '#/components/schemas/VpDashboardOrderCostDetailsDto'
        factory_conversion_rate:
          type: number
        factory_currency:
          type: string
        factory_po_doc:
