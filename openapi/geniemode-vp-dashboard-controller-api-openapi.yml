components:
  schemas:
    CompanyDTO:
      type: object
      properties:
        ask_buyer_wip_on_order:
          type: boolean
        company_name:
          type: string
        compliances:
          type: array
          items:
            type: string
        id:
          type: integer
          format: int64
        min_buy_sell_margin:
          type: number
        min_commission_margin:
          type: number
        min_trading_margin:
          type: number
      title: CompanyDTO
    VpDashboardDelayBreakdown:
      type: object
      properties:
        order_count:
          type: integer
          format: int64
        penalty_sum:
          type: number
          format: double
        reason:
          type: string
      title: VpDashboardDelayBreakdown
    VpBulkChangeStatusFailureItem:
      type: object
      properties:
        order_id:
          type: integer
          format: int64
        reason:
          type: string
      title: VpBulkChangeStatusFailureItem
    VpDashboardOrderCostDetailsDto:
      type: object
      properties:
        changed_shipment_mode:
          type: string
        cm_cost:
          type: number
        factory_margin_amount:
          type: number
        factory_margin_percentage:
          type: number
        final_price_quoted_to_buyer_in_buyer_currency:
          type: number
        final_price_quoted_to_buyer_in_factory_currency:
          type: number
        finishing_charges:
          type: number
        handling_charges:
          type: number
        margin_amount:
          type: number
        margin_percentage:
          type: number
        order_id:
          type: integer
          format: int64
        overhead_cost:
          type: number
        packaging_charges:
          type: number
        planned_shipment_mode:
          type: string
        sku:
          type: string
        sku_img:
          type: array
          items:
            $ref: '#/components/schemas/SkuIdUrlResponse'
        testing_charges:
          type: number
        total_direct_cost:
          type: number
        total_fabric_cost:
          type: number
        total_factory_cost:
          type: number
        total_factory_price:
          type: number
        total_print_embroidery_cost:
          type: number
        total_trim_cost:
          type: number
        total_washing_cost:
          type: number
      title: VpDashboardOrderCostDetailsDto
    VpChangeStatusRequestPayload:
      type: object
      properties:
        margin_approval_doc:
          type: string
        reason:
          type: string
        sku_logistic_details:
          type: array
          items:
            $ref: '#/components/schemas/OrderLogisticsDetailSkusVpEditRequestPayload'
      title: VpChangeStatusRequestPayload
    VpDashboardSummaryResponse:
      type: object
      properties:
        avg_pending_days:
          type: number
          format: double
        buyer_days_pushed:
          type: integer
          format: int64
        complete_count:
          type: integer
          format: int64
        delay_breakdown:
          type: array
          items:
            $ref: '#/components/schemas/VpDashboardDelayBreakdown'
        delayed_count:
          type: integer
          format: int64
        factory_days_pushed:
          type: integer
          format: int64
        on_time_count:
          type: integer
          format: int64
        penalty_count:
          type: integer
          format: int64
        penalty_sum:
          type: number
          format: double
        tna_days_pushed:
          type: integer
          format: int64
        total_order_value:
          type: number
          format: double
        total_orders:
          type: integer
          format: int64
        total_pending_days:
          type: integer
          format: int64
      title: VpDashboardSummaryResponse
    ManufacturerApprovalRequestPayload:
      type: object
      properties:
        page_type:
          type: string
        rejection_reason:
          type: string
        status:
          type: string
          pattern: ^(approved|pending|rejected)$
      title: ManufacturerApprovalRequestPayload
    VpDashboardOrderViewDto:
      type: object
      properties:
        buyer_currency:
          type: string
        buyer_po_list:
          type: array
          items:
            $ref: '#/components/schemas/OrderDetailBuyerPODocResponseDto'
        buyer_shipment_type:
          type: string
        company:
