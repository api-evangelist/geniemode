        '403':
          description: Forbidden!!!!!
        '500':
          description: 500 message
    post:
      tags:
      - po-controller
      summary: getPoHistoryOrderList
      operationId: getPoHistoryOrderListUsingPOST
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PoGetHistoryOrderListResponsePayloadDto'
