      - name: orderId
        in: query
        description: orderId
        required: false
        schema:
          type: integer
          format: int64
      - name: showOriginal
        in: query
        description: showOriginal
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
