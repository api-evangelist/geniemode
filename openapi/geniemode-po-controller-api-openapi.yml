openapi: 3.2.0
info:
  description: Cataloguing API.
  version: API V
  title: Cataloguing Po Controller API
  termsOfService: Terms of service
  contact:
    name: Mani Bhushan
    url: www.geniemode.com
    email: mani.kumar@geniemode.com
  license:
    name: License of API
    url: API license URL
servers:
- url: https://portal.geniemode.com
tags:
- name: po-controller
  description: Po Controller
paths:
  /api/po/allPoHistory/{orderId}:
    get:
      tags:
      - po-controller
      summary: allPoHistory
      operationId: allPoHistoryUsingGET
      parameters:
      - name: orderId
        in: path
        description: orderId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoGetHistoryOrderListResponsePayloadDto'
        '403':
          description: Forbidden!!!!!
        '500':
          description: 500 message
  /api/po/all_buyer:
    get:
      tags:
      - po-controller
      summary: all_po_buyer_type
      operationId: all_po_buyer_typeUsingGET
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  enum:
                  - Importer
                  - Large_Retailer
                  - Online_Retailer
                  - Small_Medium_Retailer
                  - Small_Mom_And_Pop_Store
        '403':
          description: Forbidden!!!!!
        '500':
          description: 500 message
  /api/po/create:
    post:
      tags:
      - po-controller
      summary: create_po
      operationId: create_poUsingPOST
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePoRequestPayload'
        description: poRequestPayload
        required: true
  /api/po/create_new:
    post:
      tags:
      - po-controller
      summary: create_po_new
      operationId: create_po_newUsingPOST
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePoRequestPayload'
        description: poRequestPayload
        required: true
  /api/po/get_all:
    get:
      tags:
      - po-controller
      summary: index
      operationId: indexUsingGET_22
      parameters:
      - name: clientIdList
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: count
        in: query
        required: false
        schema:
          type: boolean
      - name: financeImpact
        in: query
        required: false
        schema:
          type: boolean
      - name: financeStatus
        in: query
        required: false
        schema:
          type: string
      - name: leadIdList
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: manufacturerIdList
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: rmIdList
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
        '403':
          description: Forbidden!!!!!
        '500':
          description: 500 message
  /api/po/get_po:
    get:
      tags:
      - po-controller
      summary: get_po
      operationId: get_poUsingGET
      parameters:
      - name: forFactory
        in: query
        description: forFactory
        required: false
        schema:
          type: boolean
      - name: id
        in: query
        description: id
        required: false
        schema:
          type: integer
          format: int64
      - name: orderId
        in: query
        description: orderId
        required: false
        schema:
          type: integer
          format: int64
      - name: showOriginal
        in: query
        description: showOriginal
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoGetResponsePayloadDto'
        '403':
          description: Forbidden!!!!!
        '500':
