      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
        '403':
          description: Forbidden!!!!!
        '500':
          description: 500 message
    post:
      tags:
      - courier-controller
      summary: create
      operationId: createUsingPOST
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CourierDto'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourierDto'
        description: courierRequestDto
        required: true
  /api/v1/courier/cancel/{id}:
    put:
      tags:
      - courier-controller
      summary: delete
      operationId: deleteUsingPUT
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourierCancellationRequestPayload'
        description: payload
        required: true
  /api/v1/courier/getVpBudget:
